<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Business Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6f8;color:#17212b}header{background:#17212b;color:#fff;padding:22px 18px}h1{margin:0;font-size:28px}.sub{opacity:.75;margin-top:4px}main{max-width:850px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.row{background:#fff;border-radius:17px;padding:17px;box-shadow:0 2px 9px #0001}.wide{grid-column:1/-1}.label{color:#68727d;font-size:14px}.value{font-size:25px;font-weight:750;margin-top:6px}.btn{border:0;border-radius:13px;padding:12px 15px;background:#17212b;color:#fff;font-size:15px;font-weight:650}.secondary{background:#e9edf1;color:#17212b}.green{background:#177245}.red{background:#b42318}nav{display:flex;gap:7px;overflow:auto;padding:5px 0 14px}nav .btn{white-space:nowrap}section{display:none}.active{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{display:flex;flex-direction:column;gap:9px;margin-top:12px}.rowtop{display:flex;justify-content:space-between;font-weight:700;gap:10px}.muted{font-size:13px;color:#6d7780;margin-top:5px}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:99px;background:#edf1f4;font-size:12px}.due{background:#fff0ed;color:#a62b20}.paid{background:#e9f7ef;color:#17643c}input,select{width:100%;padding:12px;border:1px solid #d6dce1;border-radius:11px;font-size:16px;margin-top:5px;background:#fff}label{display:block;font-size:13px;color:#59636d;margin-top:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{text-align:center;color:#7b858e;padding:25px}@media(max-width:560px){.grid,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><h1>🏢 Business Manager</h1><div class="sub">Orders • Payments • Debtors • Creditors</div></header><main><nav><button class="btn" onclick="show('home')">Dashboard</button><button class="btn secondary" onclick="show('orders')">📦 Orders</button><button class="btn secondary" onclick="show('payments')">⏰ Payments</button><button class="btn secondary" onclick="show('people')">👥 Debtors/Creditors</button></nav><section id="home" class="active"><div class="grid"><div class="card"><div class="label">💵 Cash Balance</div><div class="value">₹0.00</div></div><div class="card"><div class="label">🏦 Bank Balance</div><div class="value">₹0.00</div></div><div class="card"><div class="label">👥 Debtors</div><div class="value" id="debtors">₹0.00</div></div><div class="card"><div class="label">🤝 Creditors</div><div class="value" id="creditors">₹0.00</div></div><div class="card"><div class="label">📦 Pending Orders</div><div class="value" id="pending">0</div></div><div class="card"><div class="label">💳 Payments Due</div><div class="value" id="due">₹0.00</div></div><div class="card wide"><b>Quick Actions</b><div class="actions"><button class="btn" onclick="show('orders');newOrder()">+ New Order</button><button class="btn green" onclick="show('payments');newPayment()">+ Payment Due</button><button class="btn secondary" onclick="show('people');newPerson()">+ Debtor/Creditor</button></div></div></div></section><section id="orders"><div class="card"><h2>📦 Order Book</h2><button class="btn" onclick="newOrder()">+ Add Order</button><div id="orderForm"></div></div><div id="ordersList" class="list"></div></section><section id="payments"><div class="card"><h2>⏰ Payment Reminders</h2><button class="btn" onclick="newPayment()">+ Add Payment Due</button><div id="paymentForm"></div></div><div id="paymentsList" class="list"></div></section><section id="people"><div class="card"><h2>👥 Debtors & Creditors</h2><button class="btn" onclick="newPerson()">+ Add Person</button><div id="personForm"></div></div><div id="peopleList" class="list"></div></section></main><script>const K='bm1';let d=JSON.parse(localStorage.getItem(K)||'{"orders":[],"payments":[],"people":[]}');const M=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(d));render()}function show(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');render()}function newOrder(){orderForm.innerHTML='<div class="formgrid"><div><label>Customer</label><input id="oc" placeholder="Customer name"></div><div><label>Order No.</label><input id="on" placeholder="Order number"></div><div><label>Product</label><input id="op" placeholder="Product"></div><div><label>Amount ₹</label><input id="oa" type="number" placeholder="0"></div><div><label>Delivery Date</label><input id="od" type="date"></div><div><label>Status</label><select id="os"><option>New</option><option>Processing</option><option>Pending</option><option>Delivered</option><option>Cancelled</option></select></div></div><div class="actions"><button class="btn" onclick="addOrder()">Save Order</button><button class="btn secondary" onclick="orderForm.innerHTML=''">Cancel</button></div>'}function addOrder(){if(!oc.value){alert('Enter customer name');return}d.orders.unshift({id:Date.now(),c:oc.value,n:on.value,p:op.value,a:+oa.value||0,date:od.value,s:os.value});orderForm.innerHTML='';save()}function newPayment(){paymentForm.innerHTML='<div class="formgrid"><div><label>Customer / Supplier</label><input id="pn" placeholder="Name"></div><div><label>Amount Due ₹</label><input id="pa" type="number" placeholder="0"></div><div><label>Due Date</label><input id="pd" type="date"></div><div><label>Type</label><select id="pt"><option>Customer Payment</option><option>Supplier Payment</option></select></div></div><div class="actions"><button class="btn" onclick="addPayment()">Save Reminder</button><button class="btn secondary" onclick="paymentForm.innerHTML=''">Cancel</button></div>'}function addPayment(){if(!pn.value){alert('Enter name');return}d.payments.unshift({id:Date.now(),n:pn.value,a:+pa.value||0,date:pd.value,t:pt.value,paid:false});paymentForm.innerHTML='';save()}function newPerson(){personForm.innerHTML='<div class="formgrid"><div><label>Name</label><input id="rn" placeholder="Name"></div><div><label>Phone</label><input id="rp" placeholder="Phone"></div><div><label>Type</label><select id="rt"><option>Debtor</option><option>Creditor</option></select></div><div><label>Opening Balance ₹</label><input id="rb" type="number" placeholder="0"></div></div><div class="actions"><button class="btn" onclick="addPerson()">Save</button><button class="btn secondary" onclick="personForm.innerHTML=''">Cancel</button></div>'}function addPerson(){if(!rn.value){alert('Enter name');return}d.people.unshift({id:Date.now(),n:rn.value,p:rp.value,t:rt.value,b:+rb.value||0});personForm.innerHTML='';save()}function del(a,id){if(confirm('Delete this item?')){d[a]=d[a].filter(x=>x.id!==id);save()}}function paid(id){let x=d.payments.find(x=>x.id===id);x.paid=true;save()}function status(id){let x=d.orders.find(x=>x.id===id),a=['New','Processing','Pending','Delivered'];x.s=a[(a.indexOf(x.s)+1)%a.length];save()}function render(){let de=d.people.filter(x=>x.t==='Debtor').reduce((a,x)=>a+x.b,0),cr=d.people.filter(x=>x.t==='Creditor').reduce((a,x)=>a+x.b,0),du=d.payments.filter(x=>!x.paid).reduce((a,x)=>a+x.a,0);debtors.textContent=M(de);creditors.textContent=M(cr);due.textContent=M(du);pending.textContent=d.orders.filter(x=>!['Delivered','Cancelled'].includes(x.s)).length;ordersList.innerHTML=d.orders.length?d.orders.map(x=>'<div class="row"><div class="rowtop"><span>'+E(x.c)+'</span><span>'+M(x.a)+'</span></div><div class="muted">'+E(x.n||'No order no.')+' • '+E(x.p||'No product')+'</div><span class="badge">'+E(x.s)+(x.date?' • '+E(x.date):'')+'</span><div class="actions"><button class="btn secondary" onclick="status('+x.id+')">Change Status</button><button class="btn red" onclick="del(\'orders\','+x.id+')">Delete</button></div></div>').join(''):'<div class="empty">No orders yet.</div>';paymentsList.innerHTML=d.payments.length?d.payments.map(x=>'<div class="row"><div class="rowtop"><span>'+E(x.n)+'</span><span>'+M(x.a)+'</span></div><div class="muted">'+E(x.t)+' • Due '+E(x.date||'Not set')+'</div><span class="badge '+(x.paid?'paid':'due')+'">'+(x.paid?'PAID':'PENDING')+'</span><div class="actions">'+(!x.paid?'<button class="btn green" onclick="paid('+x.id+')">Mark Paid</button>':'')+'<button class="btn red" onclick="del(\'payments\','+x.id+')">Delete</button></div></div>').join(''):'<div class="empty">No payment reminders yet.</div>';peopleList.innerHTML=d.people.length?d.people.map(x=>'<div class="row"><div class="rowtop"><span>'+E(x.n)+'</span><span>'+M(x.b)+'</span></div><div class="muted">'+E(x.t)+(x.p?' • '+E(x.p):'')+'</div><div class="actions"><button class="btn red" onclick="del(\'people\','+x.id+')">Delete</button></div></div>').join(''):'<div class="empty">No debtors or creditors yet.</div>'}render();</script></body></html>
